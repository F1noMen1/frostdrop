<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrostDrop — зимние кейсы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme=winter]{--bg:#050a14;--s1:#08111f;--s2:#0e1a30;--s3:#17294a;--p0:5,10,20;--p1:16,29,52;--p2:9,17,32;--a1:127,216,255;--a2:56,182,255;--a3:139,108,255;--ice:#7fd8ff;--ice2:#c4f0ff;--neon:#38b6ff;--b1:#8be0ff;--b2:#3f8cff;--line:rgba(140,200,255,.12);--line2:rgba(140,200,255,.24);--muted:#8399b8}
:root[data-theme=spring]{--bg:#061210;--s1:#0a1a16;--s2:#10261f;--s3:#1b3d31;--p0:6,16,13;--p1:20,44,36;--p2:10,24,20;--a1:140,240,180;--a2:60,210,140;--a3:255,140,190;--ice:#8cf0b4;--ice2:#dcffe9;--neon:#3cd28c;--b1:#a8ffcf;--b2:#2fbf7f;--line:rgba(160,255,200,.12);--line2:rgba(160,255,200,.24);--muted:#86ad9c}
:root[data-theme=summer]{--bg:#120a12;--s1:#1a0f1b;--s2:#261628;--s3:#3b2140;--p0:18,10,18;--p1:46,26,50;--p2:22,12,24;--a1:255,200,90;--a2:255,126,103;--a3:120,220,255;--ice:#ffd166;--ice2:#fff1c9;--neon:#ff7e67;--b1:#ffe08a;--b2:#ff8a5c;--line:rgba(255,210,150,.12);--line2:rgba(255,210,150,.24);--muted:#b39aa8}
:root[data-theme=autumn]{--bg:#110a05;--s1:#1a0f08;--s2:#27170c;--s3:#3d2413;--p0:17,10,5;--p1:50,30,15;--p2:26,15,8;--a1:255,170,90;--a2:255,120,40;--a3:220,70,50;--ice:#ffb366;--ice2:#ffe1c2;--neon:#ff8a3d;--b1:#ffc178;--b2:#ff6b2c;--line:rgba(255,190,140,.12);--line2:rgba(255,190,140,.24);--muted:#ad9583}
:root:not([data-theme=winter]) .snowcap::before{display:none}
body,.panel,.ccard,.icard,.tab,.btn{transition:background-color .4s,border-color .4s,color .4s}

:root{--bg:#050a14;--panel:var(--s2);--panel2:var(--s2);--line:rgba(var(--a1),.12);--line2:rgba(var(--a1),.24);--ice:#7fd8ff;--ice2:#c4f0ff;--neon:#38b6ff;--violet:#8b6cff;--text:#eaf4ff;--muted:#8399b8;--gold:#ffc93c;--green:#32e89b;--red:#ff4d6d;--hf:'Unbounded',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--text);background:radial-gradient(1100px 600px at 75% -10%,rgba(var(--a2),.16),transparent 60%),radial-gradient(900px 500px at -5% 15%,rgba(var(--a3),.14),transparent 60%),radial-gradient(800px 600px at 50% 110%,rgba(var(--a2),.08),transparent 60%),var(--bg);background-attachment:fixed;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-thumb{background:var(--s2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* header */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;padding:10px 22px;background:rgba(var(--p0),.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--hf);font-weight:800;font-size:20px;letter-spacing:.5px;white-space:nowrap;cursor:pointer;user-select:none}
.logo .mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--b1),var(--b2) 60%,rgb(var(--a3)));box-shadow:0 0 22px rgba(var(--a2),.55),inset 0 1px 0 rgba(255,255,255,.5)}
.logo .mark svg{width:22px;height:22px}
.logo span{background:linear-gradient(90deg,#fff,var(--ice2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{color:var(--ice);-webkit-text-fill-color:var(--ice);font-size:20px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:12px;color:var(--muted);font-weight:800;font-size:14px;white-space:nowrap;transition:.18s}
.tab:hover{color:#fff;background:rgba(var(--a1),.06)}
.tab.active{color:#fff;background:linear-gradient(180deg,rgba(var(--a1),.18),rgba(var(--a1),.04));box-shadow:inset 0 0 0 1px rgba(var(--a1),.32),0 0 22px rgba(var(--a2),.18)}
.tab .ti{font-size:15px}
.tab.admin{color:#ffb4c2}
.hright{display:flex;align-items:center;gap:10px}
.bal{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:14px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line2);box-shadow:0 0 24px rgba(var(--a2),.12);transition:.3s}
.bal b{font-family:var(--hf);font-size:15px;font-weight:700;min-width:70px;text-align:right}
.bal.up{box-shadow:0 0 28px rgba(50,232,155,.45);border-color:rgba(50,232,155,.6)}
.bal.down{box-shadow:0 0 22px rgba(255,77,109,.3)}
.bal .bico{color:var(--ice);font-size:16px}
.bonus{padding:8px 12px;border-radius:10px;font-weight:800;font-size:13px;background:linear-gradient(135deg,#ffcf4a,#ff8a3d);color:#2a1300;box-shadow:0 0 18px rgba(255,180,60,.4);white-space:nowrap}
.bonus[disabled]{background:var(--s3);color:var(--muted);box-shadow:none;cursor:default}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line);font-size:16px}
.icon-btn:hover{border-color:var(--line2)}
.garland{position:absolute;left:0;right:0;bottom:-7px;height:12px;display:flex;justify-content:space-around;pointer-events:none}
.garland i{width:7px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:blink 1.6s infinite}
.garland i:nth-child(4n+1){background:#ff4d6d;box-shadow:0 0 10px #ff4d6d;animation-delay:0s}
.garland i:nth-child(4n+2){background:#ffd24a;box-shadow:0 0 10px #ffd24a;animation-delay:.4s}
.garland i:nth-child(4n+3){background:#32e89b;box-shadow:0 0 10px #32e89b;animation-delay:.8s}
.garland i:nth-child(4n){background:var(--ice);box-shadow:0 0 10px var(--ice);animation-delay:1.2s}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* feed */
.feed-wrap{display:flex;align-items:center;gap:10px;padding:14px 22px 4px;position:relative}
.feed-label{display:flex;align-items:center;gap:8px;font-family:var(--hf);font-size:11px;letter-spacing:1px;color:var(--muted);white-space:nowrap;writing-mode:horizontal-tb}
.feed-label i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.2s infinite}
.feed{display:flex;gap:8px;overflow:hidden;flex:1;mask-image:linear-gradient(90deg,#000 85%,transparent)}
.fitem{flex:0 0 auto;width:132px;height:74px;border-radius:12px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;padding:6px 8px;gap:4px;animation:fin .5s cubic-bezier(.2,.9,.3,1.2)}
.fitem::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc);box-shadow:0 0 12px var(--rc)}
.fitem::after{content:'';position:absolute;left:-20px;top:-20px;width:90px;height:90px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 30%,transparent),transparent 70%)}
.fitem svg,.fitem img{width:62px;flex:0 0 62px;position:relative;z-index:1}
.fitem .ft{position:relative;z-index:1;min-width:0;font-size:10px;line-height:1.25}
.fitem .ft b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .ft span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .ft i{display:block;font-style:normal;color:var(--ice);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem.me{border-color:rgba(255,201,60,.5)}
@keyframes fin{from{transform:translateX(-30px) scale(.8);opacity:0}to{transform:none;opacity:1}}

main{flex:1;padding:16px 22px 40px;max-width:1500px;width:100%;margin:0 auto}
.page{display:none;animation:pg .35s ease}
.page.active{display:block}
@keyframes pg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{position:relative;background:linear-gradient(180deg,rgba(var(--p1),.88),rgba(var(--p2),.88));border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.pad{padding:18px}
.snowcap::before{content:'';position:absolute;left:14px;right:14px;top:-6px;height:12px;border-radius:12px 12px 6px 6px;background:radial-gradient(14px 8px at 10% 100%,#e8f6ff 98%,transparent),radial-gradient(22px 10px at 30% 100%,#e8f6ff 98%,transparent),radial-gradient(18px 9px at 55% 100%,#e8f6ff 98%,transparent),radial-gradient(26px 10px at 80% 100%,#e8f6ff 98%,transparent),linear-gradient(#e8f6ff,#cfe9fb);opacity:.85;filter:drop-shadow(0 2px 6px rgba(var(--a1),.4))}
h1,h2,h3{font-family:var(--hf);font-weight:800;letter-spacing:.2px}
.sec{font-size:17px;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:800;font-size:14px;transition:transform .12s,box-shadow .2s,filter .2s;white-space:nowrap;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.primary{background:linear-gradient(135deg,var(--b1),var(--b2));color:#04122a;box-shadow:0 8px 26px rgba(var(--a2),.4),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.primary:hover:not([disabled]){box-shadow:0 10px 34px rgba(var(--a2),.6),inset 0 1px 0 rgba(255,255,255,.6);filter:brightness(1.07)}
.btn.gold{background:linear-gradient(135deg,#ffe27a,#ffad33);color:#2a1500;box-shadow:0 8px 26px rgba(255,180,50,.4)}
.btn.green{background:linear-gradient(135deg,#6dffbf,#18c27a);color:#022615;box-shadow:0 8px 26px rgba(50,232,155,.4)}
.btn.red{background:linear-gradient(135deg,#ff8095,#e8264b);color:#fff;box-shadow:0 8px 26px rgba(255,77,109,.35)}
.btn.ghost{background:var(--s2);border:1px solid var(--line2);color:var(--text)}
.btn.ghost:hover{border-color:var(--ice)}
.btn.big{padding:15px 26px;font-size:16px;border-radius:14px}
.btn.w100{width:100%}
.btn.shine::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3s infinite}
@keyframes shine{0%{left:-60%}40%,100%{left:130%}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted);transition:.15s}
.chip:hover{color:#fff}
.chip.on{color:#04122a;background:linear-gradient(135deg,var(--b1),var(--b2));border-color:transparent;box-shadow:0 0 16px rgba(var(--a2),.4)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:20px;padding:34px 40px;overflow:hidden;min-height:280px}
.hero::after{content:'';position:absolute;inset:0;border-radius:20px;background:radial-gradient(600px 300px at 80% 50%,rgba(255,201,60,.12),transparent 60%),radial-gradient(400px 260px at 10% 0%,rgba(var(--a1),.12),transparent 60%);pointer-events:none}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:30px;background:rgba(var(--a1),.1);border:1px solid rgba(var(--a1),.25);color:var(--ice2);font-weight:800;font-size:12px;letter-spacing:.5px}
.hero h1{font-size:clamp(28px,3.6vw,48px);line-height:1.08;margin:16px 0 12px}
.grad{background:linear-gradient(90deg,var(--ice2),var(--neon) 45%,rgb(var(--a3)) 75%,#ffc93c);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:520px;line-height:1.55}
.hero-stats{display:flex;gap:28px;margin-top:22px}
.hero-stats b{display:block;font-family:var(--hf);font-size:24px}
.hero-stats span{color:var(--muted);font-size:13px}
.hero-art{position:relative;height:240px;display:grid;place-items:center}
.hero-art svg,.hero-art img{width:min(460px,100%);filter:drop-shadow(0 30px 30px rgba(0,0,0,.55)) drop-shadow(0 0 40px rgba(255,180,80,.35));animation:floaty 5s ease-in-out infinite;position:relative;z-index:1}
.hero-glow{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,60,.35),rgba(var(--a3),.15) 45%,transparent 70%);filter:blur(10px);animation:pulse 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(-1deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}

/* case grid */
.case-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:18px}
.ccard{position:relative;padding:16px 14px 18px;border-radius:20px;text-align:center;cursor:pointer;background:linear-gradient(180deg,rgba(var(--p1),.9),rgba(var(--p2),.92));border:1px solid var(--line);transition:transform .25s cubic-bezier(.2,.9,.3,1.3),border-color .2s,box-shadow .25s;overflow:hidden}
.ccard::before{content:'';position:absolute;left:50%;top:38%;width:220px;height:220px;transform:translate(-50%,-50%);background:radial-gradient(circle,color-mix(in srgb,var(--cc) 34%,transparent),transparent 65%);transition:.3s}
.ccard:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--cc) 60%,transparent);box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 30px color-mix(in srgb,var(--cc) 28%,transparent)}
.ccard:hover::before{transform:translate(-50%,-50%) scale(1.2)}
.ccard:hover .ccover svg,.ccard:hover .ccover img{transform:translateY(-6px) rotate(-3deg) scale(1.05)}
.ccover{position:relative;height:150px;display:grid;place-items:center}
.ccover svg,.ccover img{width:180px;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
.cname{position:relative;font-family:var(--hf);font-weight:700;font-size:15px;margin-top:8px}
.csub{position:relative;color:var(--muted);font-size:12px;margin-top:4px}
.cprice{position:relative;display:inline-block;margin-top:12px;padding:8px 16px;border-radius:10px;font-weight:800;background:rgba(var(--a1),.1);border:1px solid rgba(var(--a1),.25);color:var(--ice2)}
.ccard:hover .cprice{background:linear-gradient(135deg,var(--b1),var(--b2));color:#04122a;border-color:transparent}
.ctag{position:absolute;top:12px;left:12px;z-index:2;padding:4px 9px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.6px;background:var(--cc);color:var(--bg);box-shadow:0 0 14px var(--cc)}

/* item card */
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.icard{position:relative;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;user-select:none}
.icard::before{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc);box-shadow:0 0 14px var(--rc);z-index:2}
.icard::after{content:'';position:absolute;left:50%;top:38%;width:150px;height:110px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,color-mix(in srgb,var(--rc) 34%,transparent),transparent 70%);pointer-events:none}
.icard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--rc) 55%,transparent);box-shadow:0 10px 26px rgba(0,0,0,.4),0 0 18px color-mix(in srgb,var(--rc) 22%,transparent)}
.icard.sel{border-color:var(--ice);box-shadow:0 0 0 2px var(--ice),0 0 26px rgba(var(--a1),.4)}
.icard.sel .selmark{display:grid}
.selmark{display:none;position:absolute;top:8px;right:8px;z-index:3;width:22px;height:22px;border-radius:7px;background:var(--ice);color:#04122a;font-weight:900;font-size:13px;place-items:center}
.iimg{position:relative;z-index:1;height:78px;display:grid;place-items:center}
.iimg svg,.iimg img{width:100%;max-width:150px;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.iimg.mystery svg,.iimg.mystery img{filter:brightness(0) drop-shadow(0 0 6px var(--rc));opacity:.75}
.nm{position:relative;z-index:1;margin-top:6px;font-size:12px;line-height:1.3;min-height:32px}
.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{position:relative;z-index:1;margin-top:6px;font-weight:800;font-size:13px;color:var(--ice2)}
.chance{position:absolute;top:8px;left:8px;z-index:3;font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;background:rgba(0,0,0,.45);color:var(--rc)}
.icard.gold{background:linear-gradient(180deg,#1d1a14,#0d0f14)}
.icard.gold .iimg::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,235,160,.35) 48%,transparent 62%);background-size:250% 100%;animation:sheen 3.2s infinite;mix-blend-mode:screen;pointer-events:none}
@keyframes sheen{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.icard .sellb{position:relative;z-index:3;margin-top:8px;width:100%;padding:7px;border-radius:9px;font-size:12px;font-weight:800;background:rgba(50,232,155,.12);color:var(--green);border:1px solid rgba(50,232,155,.3);opacity:.85}
.icard .sellb:hover{background:var(--green);color:#022615;opacity:1}

/* case view */
.cv-top{display:flex;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.cv-head{display:flex;align-items:center;gap:20px}
.cv-head .cvc{width:110px;flex:0 0 110px}
.cv-head .cvc svg,.cv-head .cvc img{width:100%;filter:drop-shadow(0 12px 16px rgba(0,0,0,.5))}
.cv-head h2{font-size:26px}
.cv-head p{color:var(--muted);margin-top:6px;max-width:560px}
.cv-main{padding:22px;overflow:hidden}
.rolls{display:flex;flex-direction:column;gap:10px}
.roulette{position:relative;height:172px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,var(--s1),var(--s2) 50%,var(--s1));border:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.roulette.compact{height:128px}
.strip{position:relative;display:flex;gap:8px;padding:12px 0;will-change:transform}
.cell{position:relative;flex:0 0 150px;height:146px;border-radius:13px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid rgba(255,255,255,.05);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.roulette.compact .cell{flex-basis:118px;height:102px}
.cell::before{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc);box-shadow:0 0 16px var(--rc)}
.cglow{position:absolute;left:50%;top:44%;width:150px;height:110px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,color-mix(in srgb,var(--rc) 40%,transparent),transparent 70%)}
.cell svg,.cell img{position:relative;width:118px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.roulette.compact .cell svg,.roulette.compact .cell img{width:92px}
.cnm{position:relative;text-align:center;font-size:11px;line-height:1.25;margin-top:4px;max-width:100%}
.cnm b,.cnm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnm span{color:var(--muted)}
.roulette.compact .cnm{display:none}
.cell.won{border-color:var(--rc);box-shadow:0 0 0 2px var(--rc),0 0 40px color-mix(in srgb,var(--rc) 60%,transparent);animation:wonpop .6s ease}
@keyframes wonpop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.marker{position:absolute;top:0;bottom:0;left:50%;width:3px;transform:translateX(-50%);background:linear-gradient(180deg,#ffd56a,#fff,#ffd56a);box-shadow:0 0 14px #ffc93c,0 0 30px rgba(255,201,60,.6);z-index:5;border-radius:3px}
.marker::before,.marker::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border:9px solid transparent}
.marker::before{top:0;border-top-color:#ffd56a}
.marker::after{bottom:0;border-bottom-color:#ffd56a}
.cv-ctrl{display:flex;align-items:center;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.cnt{display:flex;gap:6px;padding:5px;border-radius:13px;background:var(--s1);border:1px solid var(--line)}
.cnt button{padding:9px 13px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.cnt button.on{background:var(--s3);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.toggle{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle i{width:38px;height:22px;border-radius:20px;background:var(--s3);position:relative;transition:.2s;border:1px solid var(--line2)}
.toggle i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8399b8;transition:.2s}
.toggle input:checked+i{background:var(--neon);border-color:transparent;box-shadow:0 0 12px rgba(var(--a2),.5)}
.toggle input:checked+i::after{left:18px;background:#fff}

/* modal / inspect */
.mback{position:fixed;inset:0;z-index:100;background:rgba(2,5,12,.72);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.modal{position:relative;width:min(1000px,100%);max-height:94vh;overflow:auto;border-radius:24px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line2);box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 60px rgba(var(--a2),.12);animation:mpop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mpop{from{transform:scale(.9) translateY(20px);opacity:0}}
.mclose{position:absolute;top:14px;right:14px;z-index:10;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.06);font-size:20px}
.mclose:hover{background:rgba(255,255,255,.12)}
.insp{display:grid;grid-template-columns:1.35fr 1fr}
.insp-stage{position:relative;min-height:420px;overflow:hidden;border-radius:24px 0 0 24px;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc) 38%,transparent),transparent 58%),linear-gradient(180deg,var(--s1),var(--s1));perspective:900px}
.insp-rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 20%,transparent) 0 5deg,transparent 5deg 16deg);animation:spin 40s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 5%,transparent 45%);mask-image:radial-gradient(circle,#000 5%,transparent 45%)}
@keyframes spin{to{transform:rotate(360deg)}}
.insp-floor{position:absolute;left:10%;right:10%;bottom:16%;height:40px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}
.insp-item{position:absolute;inset:0;display:grid;place-items:center;transform-style:preserve-3d;transition:transform .2s ease-out}
.insp-item svg,.insp-item img{width:84%;filter:drop-shadow(0 28px 26px rgba(0,0,0,.65)) drop-shadow(0 0 28px color-mix(in srgb,var(--rc) 55%,transparent));animation:floaty 4.5s ease-in-out infinite}
.insp-lbl{position:absolute;left:20px;top:18px;z-index:3;font-family:var(--hf);font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.55)}
.insp-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.45);font-size:18px}
.insp-nav.l{left:12px}.insp-nav.r{right:12px}
.insp-info{padding:34px 28px 26px;display:flex;flex-direction:column;gap:14px}
.insp-rar{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--rc)}
.insp-rar::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--rc);box-shadow:0 0 10px var(--rc)}
.insp-info h2{font-size:24px;line-height:1.2}
.insp-info h2 span{display:block;color:var(--rc);font-size:19px;margin-top:4px}
.wear{font-size:13px;color:var(--muted)}
.fbar{position:relative;height:8px;border-radius:6px;margin:8px 0 4px;background:linear-gradient(90deg,#32e89b 0 7%,#9be24a 7% 15%,#ffd24a 15% 38%,#ff9b3d 38% 45%,#ff4d6d 45% 100%)}
.fbar i{position:absolute;top:-5px;width:3px;height:18px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff;transform:translateX(-50%)}
.insp-price{font-family:var(--hf);font-size:32px;font-weight:800;color:#fff;text-shadow:0 0 24px color-mix(in srgb,var(--rc) 60%,transparent)}
.insp-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:62px;height:46px;border-radius:10px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.thumb::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.thumb svg,.thumb img{width:54px}
.thumb.on{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice)}
.confetti{position:absolute;width:8px;height:12px;top:-20px;z-index:6;animation:conf 2.2s ease-in forwards;border-radius:2px}
@keyframes conf{to{transform:translateY(520px) rotate(720deg);opacity:0}}

/* toasts */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{padding:12px 16px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:700;font-size:14px;animation:tin .3s cubic-bezier(.2,.9,.3,1.3);max-width:340px}
.toast.ok{border-color:rgba(50,232,155,.5)}.toast.err{border-color:rgba(255,77,109,.6)}.toast.gold{border-color:rgba(255,201,60,.6)}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* upgrade */
.up-grid{display:grid;grid-template-columns:1fr 400px 1fr;gap:16px;align-items:start}
.up-side{padding:16px;min-height:560px;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:flex-start;gap:10px;font-family:var(--hf);font-weight:700;font-size:14px;margin-bottom:12px}
.ph span{margin-left:auto;font-family:'Manrope';font-size:12px;color:var(--muted);font-weight:700}
.scroll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;overflow:auto;max-height:470px;padding:2px 4px 2px 2px}
.scroll-grid .icard{padding:8px 8px 10px}
.scroll-grid .iimg{height:58px}
.scroll-grid .nm{font-size:11px;min-height:28px}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--s3);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.inp{display:flex;align-items:center;background:var(--s1);border:1px solid var(--line2);border-radius:12px;padding:0 12px;transition:.2s}
.inp:focus-within{border-color:var(--ice);box-shadow:0 0 0 3px rgba(var(--a1),.12)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;padding:12px 0;font-weight:800;font-size:15px}
.inp span{color:var(--muted);font-weight:800}
.qb{display:flex;gap:6px;flex-wrap:wrap}
.qb button{flex:1;padding:8px 6px;border-radius:9px;background:var(--s2);border:1px solid var(--line);font-weight:800;font-size:12px;color:var(--muted);min-width:40px}
.qb button:hover{color:#fff;border-color:var(--line2)}
.search{width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;outline:0;font-weight:600;margin-bottom:10px}
.search:focus{border-color:var(--ice)}
.up-center{padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel{width:100%;max-width:340px;overflow:visible}
.wheel.win #upArc{stroke:url(#wgWin)}
.wheel.lose #upArcBg{stroke:#3a1020}
.up-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;width:100%}
.up-slot{border-radius:14px;border:1px dashed var(--line2);min-height:118px;display:grid;place-items:center;text-align:center;padding:8px;position:relative;overflow:hidden;background:var(--s1)}
.up-slot.has{border-style:solid;border-color:color-mix(in srgb,var(--rc) 60%,transparent);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc) 25%,transparent),transparent 70%),var(--s1)}
.up-slot svg,.up-slot img{width:110px}
.up-slot .t{font-size:11px;color:var(--muted);line-height:1.3}
.up-slot .t b{display:block;color:#fff;font-size:12px}
.up-slot .v{font-weight:800;color:var(--ice2);font-size:14px;margin-top:2px}
.up-arrow{font-size:22px;color:var(--ice)}
.mults{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.mults button{padding:7px 11px;border-radius:9px;background:var(--s2);border:1px solid var(--line);font-weight:800;font-size:12px;color:var(--ice2)}
.mults button:hover{border-color:var(--ice)}

/* crash */
.crash-grid{display:grid;grid-template-columns:1fr 340px;gap:16px}
.crash-stage{padding:12px;overflow:hidden}
.crash-hist{display:flex;gap:6px;overflow:hidden;margin-bottom:10px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.hchip{flex:0 0 auto;padding:6px 10px;border-radius:9px;font-weight:800;font-size:12px;background:var(--s2);border:1px solid var(--line)}
.hchip.lo{color:#ff7d93}.hchip.mid{color:var(--ice2)}.hchip.hi{color:#ffd56a;border-color:rgba(255,201,60,.4)}
.crbox{position:relative;height:min(62vh,560px);min-height:360px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.crbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.crash-side{display:flex;flex-direction:column;gap:16px}
.plist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.prow{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:7px 9px;border-radius:10px;background:var(--s1);font-size:13px}
.prow .av{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--s3);font-size:15px}
.prow .bt{color:var(--muted);font-weight:700}
.prow .co{font-weight:800;min-width:54px;text-align:right}
.prow.out .co{color:var(--green)}
.prow.dead .co{color:var(--red)}
.prow.me{box-shadow:inset 0 0 0 1px rgba(255,201,60,.4)}
.crinfo{font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px}

/* tower */
.tower-grid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.tboard{padding:22px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,rgba(var(--p1),.9),rgba(var(--p2),.9))}
.trow{display:grid;grid-template-columns:76px repeat(5,1fr);gap:8px;align-items:center;opacity:.55;transition:.25s}
.trow.active{opacity:1}
.trow.done{opacity:.9}
.tmul{font-weight:800;font-size:13px;text-align:center;padding:9px 4px;border-radius:9px;background:var(--s1);color:var(--muted)}
.trow.active .tmul{color:#04122a;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 0 16px rgba(var(--a2),.4)}
.trow.done .tmul{color:var(--green)}
.tcell{height:52px;border-radius:12px;background:linear-gradient(180deg,var(--s2),var(--s2));border:1px solid var(--line);display:grid;place-items:center;transition:transform .12s,box-shadow .2s,background .2s;position:relative;overflow:hidden}
.trow.active .tcell{cursor:pointer;border-color:rgba(var(--a1),.35);box-shadow:inset 0 0 18px rgba(var(--a1),.08)}
.trow.active .tcell:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(var(--a1),.35),inset 0 0 18px rgba(var(--a1),.15)}
.tcell svg{width:30px;height:30px}
.tcell.safe{background:linear-gradient(180deg,rgba(50,232,155,.3),rgba(50,232,155,.08));border-color:rgba(50,232,155,.6);animation:wonpop .4s}
.tcell.mine{background:linear-gradient(180deg,rgba(255,77,109,.3),rgba(255,77,109,.08));border-color:rgba(255,77,109,.6)}
.tcell.mine.hit{animation:shake .4s;box-shadow:0 0 24px rgba(255,77,109,.6)}
.tcell.ghost{opacity:.45}
.tcell.picked{box-shadow:0 0 0 2px #fff}
.tstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.tstat div{padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.tstat span{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.tstat b{font-family:var(--hf);font-size:16px}

/* battles */
.bl-grid{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.bcase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bcase{position:relative;padding:10px;border-radius:14px;text-align:center;background:var(--s2);border:1px solid var(--line);cursor:pointer;transition:.15s}
.bcase:hover{border-color:var(--cc);transform:translateY(-2px)}
.bcase svg,.bcase img{width:100px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.bcase b{display:block;font-size:12px;margin-top:4px}
.bcase span{font-size:12px;color:var(--ice2);font-weight:800}
.bcase .add{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:8px;background:var(--ice);color:#04122a;font-weight:900;display:grid;place-items:center}
.bsel{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;margin-bottom:12px}
.bsrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--s1)}
.bsrow svg,.bsrow img{width:44px}
.bsrow b{font-size:13px}.bsrow span{display:block;font-size:12px;color:var(--muted)}
.cntc{display:flex;align-items:center;gap:6px}
.cntc button{width:26px;height:26px;border-radius:8px;background:var(--s3);font-weight:900}
.btop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;margin-bottom:14px}
.brounds{display:flex;gap:6px;flex:1;overflow:auto}
.bround{flex:0 0 auto;width:56px;height:50px;border-radius:10px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;opacity:.5;transition:.2s}
.bround svg,.bround img{width:46px}
.bround.cur{opacity:1;border-color:var(--ice);box-shadow:0 0 14px rgba(var(--a1),.4)}
.bround.done{opacity:.85}
.bcols{display:grid;gap:12px}
.bcol{padding:12px;display:flex;flex-direction:column;gap:10px;transition:.4s;min-width:0}
.bcol.winner{border-color:rgba(255,201,60,.7);box-shadow:0 0 40px rgba(255,201,60,.25)}
.bcol.loser{opacity:.55;filter:grayscale(.5)}
.bph{display:flex;align-items:center;gap:10px}
.bph .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s3);font-size:20px;flex:0 0 40px}
.bph b{display:block;font-size:14px}
.bph .tot{font-family:var(--hf);font-size:15px;color:var(--ice2)}
.bph .crown{margin-left:auto;font-size:22px;display:none}
.bcol.winner .crown{display:block;animation:wonpop .6s}
.vroul{position:relative;height:250px;overflow:hidden;border-radius:14px;background:linear-gradient(90deg,var(--s1),var(--s2) 50%,var(--s1));border:1px solid var(--line);-webkit-mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent)}
.vroul .strip{flex-direction:column;padding:0 8px;gap:6px}
.vroul .cell{flex:0 0 100px;height:100px;width:100%}
.vroul .cell svg,.vroul .cell img{width:96px}
.vroul .cnm{font-size:10px}
.vmark{position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);background:linear-gradient(90deg,#ffd56a,#fff,#ffd56a);box-shadow:0 0 14px #ffc93c;z-index:5}
.vmark::before,.vmark::after{content:'';position:absolute;top:50%;transform:translateY(-50%);border:8px solid transparent}
.vmark::before{left:0;border-left-color:#ffd56a}.vmark::after{right:0;border-right-color:#ffd56a}
.bdrops{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.bdrop{position:relative;border-radius:10px;background:var(--s1);padding:6px;text-align:center;font-size:10px;font-weight:800;color:var(--ice2);animation:fin .4s;overflow:hidden}
.bdrop::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.bdrop svg,.bdrop img{width:100%;height:34px}
.bres{margin-top:16px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.bres h2{font-size:24px}
.countdown{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none;font-family:var(--hf);font-size:140px;font-weight:800;color:#fff;text-shadow:0 0 40px var(--neon)}
.countdown span{animation:cd .9s ease forwards}
@keyframes cd{from{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}to{transform:scale(.7);opacity:0}}

/* inventory */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:16px 18px}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.stat b{display:block;font-family:var(--hf);font-size:22px;margin-top:6px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
select.sel{background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--text);font-weight:700;outline:0}

/* admin */
.adm-grid{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
.adm-col{display:flex;flex-direction:column;gap:16px}
.adm-warn{display:flex;gap:10px;align-items:center;padding:12px 16px;margin-bottom:16px;border-radius:14px;background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.3);color:#ffb4c2;font-weight:700;font-size:13px}
.luck-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.luck-opt{padding:14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left;transition:.2s}
.luck-opt b{display:block;font-size:14px;margin:6px 0 4px}
.luck-opt span{font-size:12px;color:var(--muted);line-height:1.4}
.luck-opt .ic{font-size:22px}
.luck-opt.on{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice),0 0 24px rgba(var(--a1),.25)}
.luck-opt.streamer.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 24px rgba(255,201,60,.3)}
input[type=range]{width:100%;accent-color:#5aa8ff}
.lval{font-family:var(--hf);font-size:28px;font-weight:800}
.adm-items{max-height:640px}
.big-bal{font-family:var(--hf);font-size:30px;font-weight:800;margin-bottom:12px}

img.isvg{display:block;object-fit:contain;margin:0 auto;user-select:none}
.iimg img{width:auto;max-width:100%;max-height:100%}
.bdrop img{height:38px;width:100%}
.hero-art img{max-height:260px;object-fit:contain}
img.cimg{display:block;margin:0 auto;object-fit:cover;aspect-ratio:1;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 52%,transparent 71%);mask-image:radial-gradient(circle at 50% 50%,#000 52%,transparent 71%)}
.ccover img.cimg{width:200px;margin-top:-20px;margin-bottom:-20px}
.ccover{overflow:visible}
.ico{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:0 0 auto}

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const money=v=>'$'+(Math.round(v*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

  tone(f,d,type='sine',v=.2,when=0,slide=null){if(!this.ok())return;const t=this.ctx.currentTime+when;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.03);},

/* ================= odds ================= */
const RTP=0.88;
const oddsCache={};
function caseOdds(c,luck=1){
  const key=c.id+'|'+luck; if(oddsCache[key]) return oddsCache[key];
  const its=c.items.map(id=>ITEM[id]); const prices=its.map(i=>i.price);
  const mn=Math.min(...prices), mx=Math.max(...prices);
  const target=clamp(c.price*RTP*luck, mn+(mx-mn)*0.0005, mx-(mx-mn)*0.03);
  const ev=k=>{let sw=0,se=0;for(const p of prices){const w=Math.pow(p,-k);sw+=w;se+=w*p;}return se/sw;};
  let lo=-4,hi=14;for(let i=0;i<80;i++){const mid=(lo+hi)/2;if(ev(mid)>target)lo=mid;else hi=mid;}
  const k=(lo+hi)/2; const ws=prices.map(p=>Math.pow(p,-k)); const s=ws.reduce((a,b)=>a+b,0);
  return oddsCache[key]=its.map((item,i)=>({item,p:ws[i]/s})).sort((a,b)=>b.item.price-a.item.price);
}
function pickWeighted(arr){const r=Math.random();let acc=0;for(const o of arr){acc+=o.p;if(r<acc)return o.item;}return arr[arr.length-1].item;}

/* ================= roulette ================= */
function buildStrip(strip,c,winnerId,winIndex,total){
  const odds=caseOdds(c,1);let h='';
  for(let i=0;i<total;i++){const it=i===winIndex?ITEM[winnerId]:pickWeighted(odds);h+=cellHTML(it);}
  strip.innerHTML=h;strip.style.transform='translate3d(0,0,0)';
}
function spinStrip(wrap,strip,winIndex,{axis='x',dur=6000,tick=true}={}){
  return new Promise(res=>{
    const cells=strip.children;const H=axis==='x';
    if(cells.length<2){res();return;}
    const step=H?cells[1].offsetLeft-cells[0].offsetLeft:cells[1].offsetTop-cells[0].offsetTop;
    const size=H?cells[0].offsetWidth:cells[0].offsetHeight;
    const view=H?wrap.clientWidth:wrap.clientHeight;
    const first=H?cells[0].offsetLeft:cells[0].offsetTop;
    if(!step||!view){cells[winIndex].classList.add('won');res();return;}
    const target=first+winIndex*step+size/2-view/2+(Math.random()-.5)*size*.78;
    const t0=performance.now();let last=-1,lastT=0;
    const fr=now=>{
      const t=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-t,4);const pos=target*e;
      strip.style.transform=H?`translate3d(${-pos}px,0,0)`:`translate3d(0,${-pos}px,0)`;
      const idx=Math.floor((pos+view/2-first)/step);
      if(idx!==last){if(tick&&now-lastT>30){Snd.tick();lastT=now;}last=idx;}
      if(t<1)requestAnimationFrame(fr);else{cells[winIndex].classList.add('won');res();}
    };
    requestAnimationFrame(fr);
  });
}

  const wins=Array.from({length:n},()=>pickWeighted(odds).id);
  const uids=addItems(wins);
  drawRolls(false);
  const rows=$$('#rolls .roulette');
  Snd.whoosh();
  await Promise.all(rows.map((r,i)=>{const s=r.querySelector('.strip');buildStrip(s,c,wins[i],H_WIN,H_TOTAL);return spinStrip(r,s,H_WIN,{dur:(state.set.speed==='instant'?260:cv.fast?1300:6400)+i*140,tick:i===0});}));
  const best=wins.map(id=>ITEM[id]).sort((a,b)=>RAR[b.rar].o-RAR[a.rar].o)[0];
  Snd.win(best.rar);
  wins.forEach(id=>feedPush(nick(),id,true));
  await sleep(450);
  cv.busy=false;const ob=$('#cvOpen');if(ob)ob.disabled=false;
  showDrops(uids,{title:'ВАШ ДРОП'});
}

async function doUpgrade(){

  const fin=win?rnd(m,arcDeg-m):rnd(arcDeg+Math.min(2,(360-arcDeg)*.3),360-Math.min(2,(360-arcDeg)*.3));
  const tgt=up.target;
  // take stake
  up.snap={stake:s,chance:ch,mode:up.mode,ids:up.mode==='items'?[...up.sel].map(u=>invGet(u).id):[]};
  if(up.mode==='items'){removeUids([...up.sel]);up.sel.clear();}else addBal(-s);

  const needle=$('#upNeedle');const from=up.angle%360;const to=360*5+fin;const dur=4200;const t0=performance.now();let lastTick=Math.floor(from/12);
  await new Promise(res=>{const fr=now=>{const t=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-t,3.6);const a=from+(to-from)*e;needle.setAttribute('transform',`rotate(${a} 160 160)`);const tk=Math.floor(a/12);if(tk!==lastTick){lastTick=tk;Snd.tick();}if(t<1)requestAnimationFrame(fr);else res();};requestAnimationFrame(fr);});
  up.angle=to%360;up.spinning=false;up.result=win?'win':'lose';
  if(win){state.stats.upWins++;const us=addItems([tgt.id]);Snd.win(tgt.rar);feedPush(nick(),tgt.id,true);renderUpCenter();renderUpLeft();renderUpRight();setTimeout(()=>showDrops(us,{title:'АПГРЕЙД УСПЕШЕН'}),500);}
  else{Snd.lose();toast('Апгрейд не удался','err');renderUpCenter();renderUpLeft();renderUpRight();}
  save();
}

/* ================= CRASH ================= */
const GROW=0.075;
const BOTS=[{n:'FrostByte',a:'#38b6ff'},{n:'Snowball',a:'#7fd8ff'},{n:'IceKing',a:'#5a7bff'},{n:'Rudolf',a:'#c0622a'},{n:'Дед Мороз',a:'#e03a4a'},{n:'Krampus',a:'#8a2be2'},{n:'Yeti',a:'#9aa8b8'},{n:'Blizzard',a:'#2ec4b6'},{n:'Пингвин',a:'#3a4a6a'},{n:'Снегурка',a:'#ff6aa0'}];
const cr={phase:'wait',round:1,waitEnd:performance.now()+5000,start:0,cp:1,mult:1,crashT:0,crashEnd:0,bet:null,bots:[],scroll:0,parts:[],flakes:[],stars:[],snow:[],ctx:null,W:0,H:0,dpr:1,lastDraw:0,raf:0,sx:0,sy:0,ring:null,built:false,lastBtn:''};
for(let i=0;i<120;i++)cr.stars.push({x:Math.random(),y:Math.random(),r:Math.random()<.15?2:1,t:.5+Math.random()*2,p:Math.random()*6});
for(let i=0;i<90;i++)cr.snow.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.2,s:.3+Math.random()});
function crGen(L){const r=Math.random();const v=0.96*L/(1-Math.min(r,.9999));return clamp(Math.floor(v*100)/100,1,5000);}
function crActiveBet(){const b=cr.bet;return b&&b.round===cr.round&&cr.phase!=='wait'?b:null;}
function crNewBots(){cr.bots=shuffle(BOTS).slice(0,3+Math.floor(Math.random()*5)).map(b=>({...b,bet:Math.round(rnd(1,Math.random()<.2?400:60)*100)/100,target:Math.random()<.12?1e9:+(1.1+Math.pow(Math.random(),2.2)*9).toFixed(2),out:0}));}
crNewBots();
function crLogic(){
  if(NET.on){if(cr.phase==='fly')cr.mult=Math.exp(GROW*(performance.now()-cr.start)/1000);crUI();return;}
  const now=performance.now();
  if(cr.phase==='wait'){if(now>=cr.waitEnd)crStart(now);}
  else if(cr.phase==='fly'){
    cr.mult=Math.exp(GROW*(now-cr.start)/1000);
    if(cr.mult>=cr.cp){crCrash(now);return;}
    const b=crActiveBet();if(b&&!b.cashed&&b.auto>=1.01&&cr.mult>=b.auto)crCashout(b.auto);
    let ch=false;for(const bt of cr.bots)if(!bt.out&&cr.mult>=bt.target){bt.out=bt.target;ch=true;}
    if(ch)renderCrPlayers();
  }else if(cr.phase==='crash'){if(now>=cr.crashEnd)crToWait(now);}
  crUI();
}
function crStart(now){
  cr.phase='fly';cr.start=now;cr.mult=1;cr.flakes=[];
  const has=cr.bet&&cr.bet.round===cr.round;
  cr.cp=crGen(has?state.luck:1);
  if(has)state.stats.crash++;
  if(cur==='crash'){Snd.engStart();Snd.whoosh();}
  renderCrPlayers();
}
function crCrash(now){
  cr.phase='crash';cr.mult=cr.cp;cr.crashT=now;cr.crashEnd=now+3200;
  Snd.engStop();if(cur==='crash')Snd.boom();
  crBurst(cr.sx,cr.sy-30,true);
  const b=crActiveBet();
  if(b&&!b.cashed){toast(`Снеговик улетел на x${cr.cp.toFixed(2)} — ставка ${money(b.amount)} сгорела`,'err');cr.bet=null;}
  state.crashHist.unshift(cr.cp);state.crashHist=state.crashHist.slice(0,30);save();
  renderCrHist();renderCrPlayers();
}
function crToWait(now){cr.round++;cr.phase='wait';cr.waitEnd=now+6000;cr.mult=1;if(cr.bet&&cr.bet.round<cr.round)cr.bet=null;crNewBots();renderCrPlayers();}
function crCashout(m){
  const b=crActiveBet();if(!b||b.cashed)return;
  b.cashed=true;b.cashMult=m;const bonus=Math.min(.25,b.flakes*.01);const win=Math.round(b.amount*m*(1+bonus)*100)/100;b.win=win;
  addBal(win);Snd.coin();toast(`Забрано на x${m.toFixed(2)}: +${money(win)}${bonus?` (❄ +${Math.round(bonus*100)}%)`:''}`,'ok');renderCrPlayers();
}
function crBtnClick(){
  if(NET.on){const b=cr.bet;
    if(b&&b.round===cr.round&&cr.phase==='fly'&&!b.cashed){if(b.pending)return;b.pending=true;netSend({t:'cashout'}).then(r=>{b.pending=false;if(r&&r.m&&!b.cashed)crCashout(r.m);else if(r&&r.err&&!b.cashed)toast('Не успел!','err');});return;}
    if(b&&!b.cashed&&(b.round>cr.round||(b.round===cr.round&&cr.phase==='wait'))){if(b.sent)netSend({t:'cancel'});addBal(b.amount);cr.bet=null;toast('Ставка отменена');renderCrPlayers();crUI();return;}
    const amt=Math.round((+$('#crAmt').value||0)*100)/100;if(amt<0.1){toast('Минимальная ставка $0.10','err');return;}if(amt>state.balance){noMoney($('#crBtn'));return;}
    const round=cr.phase==='wait'?cr.round:cr.round+1;addBal(-amt);cr.bet={amount:amt,auto:+$('#crAuto').value||0,round,cashed:false,flakes:0,sent:false};Snd.click();
    if(round===cr.round)netBet(cr.bet);toast(round===cr.round?`Ставка ${money(amt)} принята`:`Ставка ${money(amt)} — на следующий раунд`,'ok');renderCrPlayers();crUI();return;}
  const b=cr.bet;
  if(b&&b.round===cr.round&&cr.phase==='fly'&&!b.cashed){crCashout(cr.mult);return;}
  if(b&&!b.cashed&&(b.round>cr.round||(b.round===cr.round&&cr.phase==='wait'))){addBal(b.amount);cr.bet=null;toast('Ставка отменена');renderCrPlayers();crUI();return;}
  const amt=Math.round((+$('#crAmt').value||0)*100)/100;
  if(amt<0.1){toast('Минимальная ставка $0.10','err');return;}
  if(amt>state.balance){noMoney($('#crBtn'));return;}
  const round=cr.phase==='wait'?cr.round:cr.round+1;
  addBal(-amt);cr.bet={amount:amt,auto:+$('#crAuto').value||0,round,cashed:false,flakes:0};Snd.click();
  toast(round===cr.round?`Ставка ${money(amt)} принята`:`Ставка ${money(amt)} — на следующий раунд`,'ok');
  renderCrPlayers();crUI();
}
function crUI(){
  const btn=$('#crBtn');if(!btn)return;const b=cr.bet;let lbl,cls;
  if(b&&b.round===cr.round&&cr.phase==='fly'&&!b.cashed){const bonus=Math.min(.25,b.flakes*.01);lbl=`Забрать ${money(b.amount*cr.mult*(1+bonus))}`;cls='green';}
  else if(b&&!b.cashed&&(b.round>cr.round||(b.round===cr.round&&cr.phase==='wait'))){lbl=b.round===cr.round?'Отменить ставку':'Отменить (след. раунд)';cls='red';}
  else{lbl=cr.phase==='wait'?'Поставить':'Ставка на след. раунд';cls='primary';}

function towerStart(){

function towerPick(c){
  const g=state.tower;if(!g||g.over)return;
  const p=clamp(g.mines/5/state.luck,0,.95);const hit=Math.random()<p;
  const others=shuffle([0,1,2,3,4].filter(x=>x!==c));
  const mines=hit?[c,...others.slice(0,g.mines-1)]:others.slice(0,g.mines);
  g.rows.push({mines,pick:c});

}

/* ================= snow background ================= */
const PART=(function(){const cv=$('#snow'),c=cv.getContext('2d');let W,H,fl=[],type='winter',col='';
  const LEAF=['#e8742a','#c9461f','#f2b33d','#a8431a','#d9952b'],PET=['#ffc0d9','#ffd6e7','#ffb3cf','#fff0f6'],CONF=['#ff4d6d','#ffc93c','#32e89b','#38b6ff','#8b6cff','#ff8a3d'],HEART=['#ff4d6d','#ff6aa0','#ff8fb3','#e0245e'];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const mk=any=>{const b={x:Math.random()*W,y:any?Math.random()*H:-14,d:Math.random()*6.28,rot:Math.random()*6.28,rs:(Math.random()-.5)*.06,ph:Math.random()*6.28};
    switch(type){
      case 'spring':return {...b,r:3+Math.random()*3.5,s:.35+Math.random()*.5,a:.55+Math.random()*.4,col:pick(PET)};
      case 'autumn':return {...b,r:6+Math.random()*6,s:.5+Math.random()*.7,a:.75+Math.random()*.25,col:pick(LEAF)};
      case 'summer':return {...b,y:any?Math.random()*H:H+10,r:1.2+Math.random()*1.8,s:.15+Math.random()*.35,a:1};
      case 'bubbles':return {...b,y:any?Math.random()*H:H+20,r:3+Math.random()*12,s:.3+Math.random()*.6,a:.25+Math.random()*.35};
      case 'stars':return {...b,y:Math.random()*H,r:.5+Math.random()*1.8,s:.02+Math.random()*.05,a:1};
      case 'hearts':return {...b,r:5+Math.random()*7,s:.4+Math.random()*.6,a:.6+Math.random()*.35,col:pick(HEART)};
      case 'confetti':return {...b,r:3+Math.random()*4,s:.8+Math.random()*1.2,a:.9,col:pick(CONF)};
      case 'money':return {...b,r:10+Math.random()*10,s:.6+Math.random()*.8,a:.5+Math.random()*.4};
      default:return {...b,r:Math.random()*2.4+.4,s:Math.random()*.6+.25,a:Math.random()*.55+.2};}};
  const BASE={winter:170,spring:70,autumn:55,summer:60,bubbles:45,stars:160,hearts:45,confetti:90,money:35,none:0};
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;const base=BASE[type]||0;const dense=type==='winter'||type==='stars'?11000:24000;
    const n=Math.round(Math.min(base,Math.floor(W*H/dense))*(state.set.density/100));fl=Array.from({length:Math.max(0,n)},()=>mk(true));}
  addEventListener('resize',rs);let last=performance.now(),shoot=null;
  function heart(r){c.beginPath();c.moveTo(0,r*.35);c.bezierCurveTo(-r*1.1,-r*.45,-r*.45,-r*1.15,0,-r*.45);c.bezierCurveTo(r*.45,-r*1.15,r*1.1,-r*.45,0,r*.35);c.fill();}
  function fr(now){const dt=Math.min(50,now-last)/16.7;last=now;
    if(!document.hidden){c.clearRect(0,0,W,H);
      if(state.set.particles&&type!=='none'){
      for(const f of fl){
        if(type==='summer'||type==='bubbles'){f.d+=.01*dt;f.y-=f.s*dt;f.x+=Math.sin(f.d)*.4*dt;f.ph+=.04*dt;if(f.y<-20)Object.assign(f,mk(false));
          if(type==='summer'){const al=.35+.65*Math.abs(Math.sin(f.ph));c.globalAlpha=al*.25;c.fillStyle=col||'#ffd166';c.beginPath();c.arc(f.x,f.y,f.r*4,0,6.283);c.fill();c.globalAlpha=al;c.fillStyle='#fff3c4';c.beginPath();c.arc(f.x,f.y,f.r,0,6.283);c.fill();}

  $$('#page-settings [data-acc]').forEach(b=>b.onclick=()=>{setSet('accent',b.dataset.acc);Snd.click();renderSettings();});
  $('#stAcc').oninput=e=>{state.set.accent=e.target.value;save();applySettings();};
  $('#stAcc').onchange=()=>renderSettings();
  $$('#page-settings .bgt').forEach(b=>b.onclick=()=>{const v=b.dataset.bg;if(v==='image'&&!state.set.bgImg){$('#stBgFile').click();return;}if(v==='image'&&state.set.bg==='image'){$('#stBgFile').click();return;}setSet('bg',v);Snd.click();renderSettings();});
  $('#stBgCol').oninput=e=>{state.set.bgColor=e.target.value;state.set.bg='color';save();applySettings();};
  $('#stBgCol').onchange=()=>renderSettings();
  $('#stDim').oninput=e=>{state.set.bgDim=+e.target.value;$('#stDimL').textContent=state.set.bgDim+'%';save();applySettings();};
  $('#stBlur').oninput=e=>{state.set.bgBlur=+e.target.value;$('#stBlurL').textContent=state.set.bgBlur+'px';save();applySettings();};
  $('#stBgFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,1920/Math.max(img.width,img.height));const cv2=document.createElement('canvas');cv2.width=Math.round(img.width*k);cv2.height=Math.round(img.height*k);cv2.getContext('2d').drawImage(img,0,0,cv2.width,cv2.height);let q=.85,d=cv2.toDataURL('image/jpeg',q);while(d.length>2.2e6&&q>.4){q-=.1;d=cv2.toDataURL('image/jpeg',q);}
    state.set.bgImg=d;state.set.bg='image';try{localStorage.setItem(KEY,JSON.stringify(state));toast('Фон установлен','ok');}catch(x){toast('Картинка слишком большая для сохранения — выбери другую','err');}applySettings();renderSettings();URL.revokeObjectURL(img.src);};img.src=URL.createObjectURL(f);};
  const ph=$('#stPhoto');if(ph){ph.onclick=()=>$('#stPhotoF').click();$('#stPhotoF').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=await squareImg(f,160);netProfile(d);toast('Аватар обновлён','ok');setTimeout(renderSettings,700);}catch(x){toast('Не получилось прочитать фото','err');}};}
  const phx=$('#stPhotoX');if(phx)phx.onclick=()=>{netProfile('');setTimeout(renderSettings,700);};
  const lo=$('#stLogout');if(lo)lo.onclick=async()=>{saveNow();await api('/api/logout',{token:NET.token});try{localStorage.removeItem('fd_tok');}catch(e){}location.reload();};
  $('#stDef').onclick=()=>{state.set=Object.assign({},DEFSET);save();applySettings();cv.fast=false;bt.fast=false;toast('Настройки сброшены','ok');renderSettings();};
}

/* ================= NET (real players) ================= */
const NET={server:false,user:null,token:'',on:false,cid:'',off:0,online:[],chat:[],lobbies:[],es:null,unread:0};
try{NET.cid=localStorage.getItem('fd_cid')||'';}catch(e){}
if(!/^[a-z0-9]{8,40}$/.test(NET.cid)){NET.cid=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>(b%36).toString(36)).join('');try{localStorage.setItem('fd_cid',NET.cid);}catch(e){}}
async function netSend(o){if(!NET.on)return {err:'offline'};try{const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:NET.token,...o})});return await r.json();}catch(e){return {err:'нет связи'};}}
async function netInit(){
  if(!NET.server||!NET.token)return;
  const es=new EventSource(`/api/events?token=${encodeURIComponent(NET.token)}`);NET.es=es;
  es.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}netMsg(m);};
  es.onerror=()=>{if(NET.on){NET.on=false;netUI();toast('Связь с сервером потеряна — переподключаюсь…','err');if(cr.phase==='fly'&&cr.cp>1e8)cr.cp=Math.max(cr.mult+.01,crGen(1));}};
}
function netMsg(m){
  switch(m.t){
    case 'hello':{const first=!NET.on;NET.on=true;if(m.me)NET.cid=m.me;NET.off=m.now-performance.now();NET.online=m.online;NET.chat=m.chat||[];NET.lobbies=m.lobbies||[];
      (m.feed||[]).forEach(d=>{if(d.cid!==NET.cid)feedPush(d.nick,d.id,false);});
      netCrash(m.crash);netUI();renderChat();if(cur==='battles'&&bt.view==='lobby')renderLobby();if(cur==='crash')renderers.crash();if(first)toast(`Онлайн: ${m.online.length} игрок(ов) на сервере`,'ok');break;}
    case 'online':NET.online=m.list;netUI();break;
    case 'chat':NET.chat.push(m.m);if(NET.chat.length>80)NET.chat.shift();if($('#chatPanel').hidden&&m.m.cid!==NET.cid){NET.unread++;Snd.ping();}renderChat();break;
    case 'drop':if(m.cid!==NET.cid)feedPush(m.nick,m.id,false);break;
    case 'crash':netCrash(m);break;
    case 'cbets':if(m.round===cr.round){cr.netBets=m.bets;netApplyOuts();renderCrPlayers();}break;
    case 'lobbies':NET.lobbies=m.list;if(cur==='battles'&&bt.view==='lobby')drawNetLobbies();break;
    case 'battle':{const L=m.lobby;const mine=L.players.some(p=>p.cid===NET.cid);if(mine&&!bt.running){toast('Баттл начинается!','gold');bt.players_=null;go('battles');startBattle(L);}break;}
    case 'grant':{if(m.balance)addBal(m.balance);if(m.items&&m.items.length){addItems(m.items);onInv();}if(m.luck!=null){state.luck=m.luck;save();}
      const parts=[];if(m.balance)parts.push((m.balance>0?'+':'')+money(m.balance));if(m.items&&m.items.length)parts.push(m.items.length===1?`${ITEM[m.items[0]].weapon} | ${ITEM[m.items[0]].skin}`:`${m.items.length} предметов`);
      if(parts.length){toast(`${I('gift')} Администратор ${esc(m.from)} выдал: ${esc(parts.join(', '))}`,'gold');Snd.win('gold');}saveNow();break;}
    case 'role':NET.user=m.user;$('.tab[data-p="admin"]').hidden=!isAdmin();$('#balAdd').hidden=!isAdmin();toast(m.user.admin?'Тебе выдали админку!':'Админку сняли',m.user.admin?'gold':'');if(cur==='admin'&&!isAdmin())go('cases');break;
    case 'bclosed':if((m.refund||[]).includes(NET.cid)){addBal(m.cost);toast(`Лобби закрыто — возвращено ${money(m.cost)}`,'ok');}break;
  }
}
function netUI(){
  const p=$('#onlinePill');p.hidden=!NET.on;$('#onlineN').textContent=NET.online.length;
  $('#chatDock').hidden=!NET.on;$('#chatOnline').textContent=`● ${NET.online.length} онлайн`;
  $('#chatUsers').innerHTML=NET.online.map(u=>`<span title="${esc(u.nick)}">${av(u.nick,u.ava,u.cid===NET.cid,u.img)}</span>`).join('');
  const b=$('#chatBadge');b.hidden=!NET.unread;b.textContent=NET.unread;
}
function renderChat(){const L=$('#chatList');if(!L)return;const atBottom=L.scrollHeight-L.scrollTop-L.clientHeight<60;
  L.innerHTML=NET.chat.length?NET.chat.map(m=>`<div class="cmsg ${m.cid===NET.cid?'me':''}">${av(m.nick,m.ava,m.cid===NET.cid,m.img)}<div><b>${esc(m.nick)}</b><small>${new Date(m.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</small><p>${esc(m.text)}</p></div></div>`).join(''):'<div class="empty" style="padding:30px 10px">Пока тихо. Напиши первым!</div>';
  if(atBottom)L.scrollTop=L.scrollHeight;netUI();}
let profT=0;function netProfile(img){clearTimeout(profT);profT=setTimeout(async()=>{if(!NET.token)return;const r=await api('/api/profile',{token:NET.token,nick:nick(),ava:state.set.ava,...(img!==undefined?{img}:{})});if(r.ok){NET.user=r.user;if(cur==='settings')$('#stAv').innerHTML=av(nick(),state.set.ava,true,myImg());}else if(r.err)toast(r.err,'err');},img!==undefined?0:600);}
function myImg(){return (typeof NET!=='undefined'&&NET.user&&NET.user.img)||'';}
async function api(url,body){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json();}catch(e){return {err:'Нет связи с сервером'};}}
function squareImg(file,size){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(im.src);res(c.toDataURL('image/jpeg',.85));};im.onerror=rej;im.src=URL.createObjectURL(file);});}
function applyAccount(me,tok){NET.token=tok;NET.user=me.user;NET.cid=me.user.id;try{localStorage.setItem('fd_tok',tok);}catch(e){}
  KEY='fd_acc_'+me.user.id;let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  const keepBg=local&&local.set?local.set.bgImg:'';state=normState(me.state||null);if(keepBg)state.set.bgImg=keepBg;
  state.set.nick=me.user.nick;state.set.ava=me.user.ava;Snd.on=state.sound!==false;}
async function netPre(){
  if(!/^https?:$/.test(location.protocol))return;
  try{const r=await fetch('/api/hello',{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(!j.frostdrop)return;NET.server=true;}catch(e){return;}
  let tok='';try{tok=localStorage.getItem('fd_tok')||'';}catch(e){}
  if(tok){const me=await api('/api/me',{token:tok});if(me.ok){applyAccount(me,tok);return;}}
  const r=await authScreen();applyAccount(r.me,r.token);
}
function authScreen(){return new Promise(resolve=>{
  const el=document.createElement('div');el.className='auth';let mode='login',img='',ava=AVA_COLS[Math.floor(Math.random()*AVA_COLS.length)],nickTouched=false;
  const draw=()=>{el.innerHTML=`<div class="auth-card"><div class="auth-logo"><div class="mark">${'<svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:none;stroke:#04122a;stroke-width:2.2;stroke-linecap:round">'+ICO.snow+'</svg>'}</div><b>FROST<small>DROP</small></b></div>
    <div class="seg auth-seg"><button data-m="login" class="${mode==='login'?'on':''}">Вход</button><button data-m="reg" class="${mode==='reg'?'on':''}">Регистрация</button></div>
    <form id="authF">
      <div class="field"><label>Почта</label><div class="inp"><input name="email" type="email" required autocomplete="email" placeholder="you@gmail.com"></div></div>
      <div class="field"><label>Пароль</label><div class="inp"><input name="password" type="password" required minlength="6" autocomplete="${mode==='reg'?'new-password':'current-password'}" placeholder="минимум 6 символов"></div></div>
      ${mode==='reg'?`<div class="field"><label>Никнейм</label><div class="inp"><input name="nick" maxlength="16" required placeholder="берётся из почты"></div></div>
      <div class="field"><label>Аватар</label><div class="auth-ava"><div id="aPrev">${av('?',ava,false,img)}</div><div class="swatches">${AVA_COLS.map(c=>`<button type="button" class="sw ${c===ava&&!img?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div><button type="button" class="btn ghost" id="aUp">${I('upload')} Фото</button><input type="file" id="aFile" accept="image/*" hidden></div></div>`:''}
      <div class="auth-err" id="aErr"></div>
      <button class="btn primary big w100 shine" type="submit">${mode==='reg'?'Создать аккаунт · старт $3':'Войти'}</button>
    </form><div class="auth-foot">Играй с друзьями: общий краш, онлайн-баттлы и чат. Баланс и инвентарь хранятся в аккаунте.</div></div>`;
    el.querySelectorAll('.auth-seg button').forEach(b=>b.onclick=()=>{const em=el.querySelector('[name=email]').value;mode=b.dataset.m;draw();el.querySelector('[name=email]').value=em;});
    const f=el.querySelector('#authF'),E=f.querySelector('[name=email]'),N=f.querySelector('[name=nick]');
    if(N){E.oninput=()=>{if(!nickTouched)N.value=(E.value.split('@')[0]||'').replace(/[^\wа-яё.-]/gi,'').slice(0,16);upd();};N.oninput=()=>{nickTouched=true;upd();};}
    const upd=()=>{const p=el.querySelector('#aPrev');if(p)p.innerHTML=av((N&&N.value)||'?',ava,false,img);};
    el.querySelectorAll('.auth .sw').forEach(b=>b.onclick=()=>{ava=b.dataset.c;img='';el.querySelectorAll('.auth .sw').forEach(x=>x.classList.toggle('on',x===b));upd();});
    const up=el.querySelector('#aUp');if(up){up.onclick=()=>el.querySelector('#aFile').click();el.querySelector('#aFile').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{img=await squareImg(fl,160);el.querySelectorAll('.auth .sw').forEach(x=>x.classList.remove('on'));upd();}catch(x){}};}
    f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('button[type=submit]');btn.disabled=true;const fd=Object.fromEntries(new FormData(f));
      const r=await api(mode==='reg'?'/api/register':'/api/login',mode==='reg'?{...fd,ava,img}:fd);btn.disabled=false;
      if(r.ok){el.remove();resolve(r);}else{$('#aErr').textContent=r.err||'Ошибка';Snd.lose();}};
  };draw();document.body.appendChild(el);});}
$('#chatFab').querySelector('.ci').innerHTML=I('chat');
const openChat=()=>{const P=$('#chatPanel');P.hidden=!P.hidden;if(!P.hidden){NET.unread=0;renderChat();const L=$('#chatList');L.scrollTop=L.scrollHeight;$('#chatIn').focus();}netUI();};
$('#chatFab').onclick=openChat;$('#onlinePill').onclick=()=>{if($('#chatPanel').hidden)openChat();};$('#chatX').onclick=()=>{$('#chatPanel').hidden=true;};
$('#chatForm').onsubmit=async e=>{e.preventDefault();const i=$('#chatIn');const t=i.value.trim();if(!t)return;i.value='';const r=await netSend({t:'chat',text:t});if(r.err==='slow')toast('Не так быстро','err');};

// ---- crash online
function netCrash(s){
  if(!s)return;const L=t=>t-NET.off;
  if(s.phase==='wait'){
    if(cr.phase!=='wait'||cr.round!==s.round){cr.round=s.round;cr.phase='wait';cr.mult=1;cr.flakes=[];if(cr.bet&&cr.bet.round<cr.round)cr.bet=null;Snd.engStop();}
    cr.waitEnd=L(s.waitEnd);cr.netBets=s.bets||[];
    const b=cr.bet;if(b&&b.round===cr.round&&!b.sent)netBet(b);
  }else if(s.phase==='fly'){
    const fresh=cr.phase!=='fly'||cr.round!==s.round;cr.round=s.round;cr.phase='fly';cr.start=L(s.start);cr.cp=1e9;cr.netBets=s.bets||cr.netBets||[];
    if(fresh){cr.flakes=[];if(cur==='crash'){Snd.engStart();Snd.whoosh();}
      const b=cr.bet;if(b&&b.round===cr.round){if(!b.sent){addBal(b.amount);cr.bet=null;toast('Ставка не успела — возвращена');}else state.stats.crash++;}}
  }else if(s.phase==='crash'){
    cr.round=s.round;cr.netBets=s.bets||cr.netBets||[];netApplyOuts();
    if(cr.phase!=='crash'){if(cr.phase==='wait')cr.start=performance.now();cr.phase='fly';cr.cp=s.cp;cr.mult=s.cp;crCrash(performance.now());}
  }
  renderCrPlayers();crUI();
}
function netApplyOuts(){const me=(cr.netBets||[]).find(p=>p.cid===NET.cid);const b=cr.bet;if(me&&me.out&&b&&b.round===cr.round&&!b.cashed&&cr.phase!=='wait')crCashout(me.out);}
function netBet(b){b.sent=true;netSend({t:'bet',amount:b.amount,auto:b.auto}).then(r=>{if(r&&r.ok)return;if(cr.bet===b){addBal(b.amount);cr.bet=null;toast('Ставка не принята: '+((r&&r.err)||'нет связи'),'err');renderCrPlayers();crUI();}});}

// ---- battle lobbies online
function drawNetLobbies(){
  const box=$('#netLob');if(!box)return;
  const list=NET.lobbies.filter(l=>l.status!=='closed');
  box.innerHTML=list.length?list.map(l=>{const mine=l.players.some(p=>p.cid===NET.cid),own=l.owner===NET.cid;
    const slots=Array.from({length:l.size},(_,i)=>{const p=l.players[i];return p?`<span title="${esc(p.nick)}">${av(p.nick,p.ava,p.cid===NET.cid,p.img)}</span>`:'<span class="es">+</span>';}).join('');
    let acts='';
    if(l.status==='open'){if(own)acts=`<button class="btn gold" data-bots="${l.id}">Добавить ботов</button><button class="btn ghost" data-leave="${l.id}">Отменить</button>`;
      else if(mine)acts=`<span class="muted" style="font-size:12px">Ждём игроков…</span><button class="btn ghost" data-leave="${l.id}">Выйти</button>`;
      else acts=`<button class="btn primary" data-join="${l.id}" data-cost="${l.cost}">Войти · ${money(l.cost)}</button>`;}
    else acts=`<span class="muted" style="font-size:12px">${l.status==='run'?'Идёт баттл':'Завершён'}</span>${l.res?`<button class="btn ghost" data-watch="${l.id}">Смотреть</button>`:''}`;
    return `<div class="nlob ${mine?'mine':''}"><div class="cs">${l.cases.slice(0,4).map(id=>CASE[id]?caseSVG(CASE[id]):'').join('')}</div>
      <div class="meta"><b>${l.cases.length} раунд. · ${money(l.cost)} вход</b><span>${l.mode==='crazy'?'Безумный режим':'Классика'} · банк до ${money(l.cost*l.size)}</span></div>
      <div class="slots">${slots}</div><div class="acts">${acts}</div></div>`;}).join(''):'<div class="empty" style="padding:22px">Открытых лобби нет — создай своё ниже, друзья смогут зайти.</div>';
  $$('#netLob [data-join]').forEach(b=>b.onclick=async()=>{const cost=+b.dataset.cost;if(state.balance<cost){noMoney(b);return;}b.disabled=true;const r=await netSend({t:'bjoin',id:b.dataset.join});if(r.ok){addBal(-cost);state.stats.battles++;toast('Ты в лобби!','ok');}else{toast(r.err||'Ошибка','err');b.disabled=false;}});
  $$('#netLob [data-leave]').forEach(b=>b.onclick=async()=>{const r=await netSend({t:'bleave',id:b.dataset.leave});if(r.ok&&r.refund){addBal(r.refund);toast(`Вышел из лобби — возвращено ${money(r.refund)}`,'ok');}});
  $$('#netLob [data-bots]').forEach(b=>b.onclick=()=>netSend({t:'bbots',id:b.dataset.bots}));
  $$('#netLob [data-watch]').forEach(b=>b.onclick=()=>{const L=NET.lobbies.find(x=>x.id===b.dataset.watch);if(L&&!bt.running){bt.players_=null;startBattle(L);}});
}
async function createNetBattle(){
  if(!bt.rounds.length)return;const cost=Math.round(bt.rounds.reduce((s,id)=>s+CASE[id].price,0)*100)/100;
  if(state.balance<cost){noMoney($('#btNet'));return;}
  const r=await netSend({t:'bcreate',cases:bt.rounds,size:bt.players,mode:bt.mode});
  if(!r.ok){toast(r.err||'Не удалось создать лобби','err');return;}
  addBal(-cost);state.stats.battles++;save();toast('Лобби создано — ждём игроков или добавь ботов','ok');
}

/* ================= boot ================= */
(async()=>{
await netPre();
updBal();bonusTick();setInterval(bonusTick,1000);
applySettings();cv.fast=state.set.speed!=='normal';bt.fast=cv.fast;
$('.tab[data-p="admin"]').hidden=!isAdmin();$('#balAdd').hidden=!isAdmin();
let startTab='cases';try{startTab=localStorage.getItem('fd_tab')||'cases';}catch(e){}
if(state.set.startTab&&state.set.startTab!=='last')startTab=state.set.startTab;
if(!renderers[startTab]||startTab==='case'||(startTab==='admin'&&!isAdmin()))startTab='cases';
go(startTab);
netInit();
})();
